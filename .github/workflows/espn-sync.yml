name: ESPN sync

on:
  schedule:
    # Times are UTC. Hourly through Thursday, Sunday and Monday night games, plus once every morning.
    - cron: "0 17-23 * * 0"
    - cron: "0 0-4 * * 1,2,5"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      max_recaps:
        description: "Most recap episodes to write this run"
        default: "4"

permissions:
  contents: write
  pages: write

concurrency:
  group: espn-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull league data from ESPN
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: node scripts/fetch-espn.mjs

      # Past seasons for the rivalry tracker. A no-op once they're saved; never blocks the weekly data.
      - name: Pull past seasons from ESPN
        continue-on-error: true
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: node scripts/fetch-history.mjs

      - name: Install script dependencies
        run: npm ci --prefix scripts --no-audit --no-fund

      # Bloodsport Center: Claude writes the script, OpenAI voices it. Only runs for finished weeks
      # without an episode. A missing or expired key skips this step without blocking the weekly data.
      - name: Write Bloodsport Center recaps
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.DAVON_API }}
          OPENAI_API_KEY: ${{ secrets.VIDEO_API }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          MAX_RECAPS: ${{ inputs.max_recaps || '4' }}
        run: node scripts/write-recaps.mjs --max "$MAX_RECAPS"

      - name: Commit updated data
        id: commit
        run: |
          git add data/ media/
          if git diff --cached --quiet; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update ESPN league data"
          git push
          echo "changed=yes" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed; the push may still trigger a build."
